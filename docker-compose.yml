services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: todo
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_pass
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - todo-mysql-data:/var/lib/mysql

volumes:
  todo-mysql-data: